name: Notify app (FCM)

# hilal.json بدلتے ہی، نئی فائل لائیو ہونے کے بعد، ایپ کو پیغام بھیجتا ہے
on:
  push:
    paths:
      - 'hilal.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate hilal.json
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("hilal.json", encoding="utf-8"))
          x = d.get("in")
          if not isinstance(x, dict) or not x:
              sys.exit("hilal.json: 'in' missing or empty - not sending")
          print("hilal.json OK")
          PY

      - name: Wait until Cloudflare Pages serves the new file
        run: |
          URL="https://almizan-hilal.pages.dev/hilal.json"
          want=$(sha256sum hilal.json | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "$URL?t=$(date +%s)" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "live after try $i"; exit 0; fi
            echo "try $i: not live yet"; sleep 10
          done
          echo "new file not live after 10 min - not sending"
          exit 1

      - name: Send FCM message to topic "hilal"
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          pip install --quiet google-auth requests
          python - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ["FIREBASE_SA"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(Request())

          url = "https://fcm.googleapis.com/v1/projects/%s/messages:send" % info["project_id"]
          body = {"message": {
              "topic": "hilal",
              "data": {"u": "1"},
              "android": {"priority": "HIGH", "ttl": "3600s"},
          }}
          r = requests.post(url, json=body, timeout=30,
                            headers={"Authorization": "Bearer " + creds.token})
          print(r.status_code, r.text)
          r.raise_for_status()
          PY
          
